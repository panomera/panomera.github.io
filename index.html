<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panomera</title>
  <meta name="description" content="Panomera is in stealth. Something new is taking shape.">
  <meta name="theme-color" content="#07080c">
  <meta property="og:title" content="Panomera">
  <meta property="og:description" content="Something new is taking shape.">
  <meta property="og:url" content="https://panomera.ai/">
  <meta property="og:type" content="website">
  <link rel="canonical" href="https://panomera.ai/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07080c;
      --fg: #eceef4;
      --muted: #8a8fa0;
      --faint: #4a4f60;
      --glow-a: #4f7cff;
      --glow-b: #9b5cff;
      --glow-c: #22d3ee;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* Horizon glow */
    .sky {
      position: fixed; inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .horizon {
      position: absolute;
      left: 50%; top: 62%;
      width: 160vmax; height: 160vmax;
      transform: translateX(-50%);
      border-radius: 50%;
      background: var(--bg);
      box-shadow:
        0 -1px 0 0 rgba(255,255,255,0.35),
        0 -12px 60px 0 rgba(79,124,255,0.45),
        0 -40px 160px 10px rgba(155,92,255,0.25);
      animation: rise 2.4s cubic-bezier(.2,.7,.2,1) both;
    }
    .aurora {
      position: absolute;
      left: 50%; top: 62%;
      width: 120vmax; height: 40vmax;
      transform: translate(-50%, -60%);
      background:
        radial-gradient(closest-side, rgba(79,124,255,0.35), transparent 70%),
        radial-gradient(closest-side at 30% 60%, rgba(155,92,255,0.25), transparent 70%),
        radial-gradient(closest-side at 70% 60%, rgba(34,211,238,0.18), transparent 70%);
      filter: blur(40px);
      animation: drift 14s ease-in-out infinite alternate;
      opacity: 0.9;
    }
    .grain {
      position: absolute; inset: -50%;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.5'/></svg>");
      opacity: 0.06;
      mix-blend-mode: overlay;
    }

    @keyframes rise {
      from { transform: translate(-50%, 8%); opacity: 0; }
      to   { transform: translate(-50%, 0);  opacity: 1; }
    }
    @keyframes drift {
      from { transform: translate(-52%, -60%) scale(1); }
      to   { transform: translate(-48%, -64%) scale(1.08); }
    }
    @keyframes fade {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 18vh;
      text-align: center;
    }
    .mark {
      width: 44px; height: 44px;
      margin-bottom: 28px;
      animation: fade 1.2s .4s ease both;
    }
    h1 {
      font-weight: 300;
      font-size: clamp(2.4rem, 8vw, 5rem);
      letter-spacing: 0.32em;
      margin-right: -0.32em; /* optically center tracked text */
      text-transform: uppercase;
      animation: fade 1.2s .6s ease both;
    }
    .tagline {
      margin-top: 20px;
      color: var(--muted);
      font-size: clamp(0.95rem, 2.4vw, 1.1rem);
      font-weight: 400;
      letter-spacing: 0.02em;
      animation: fade 1.2s .9s ease both;
    }
    .status {
      margin-top: 36px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      background: rgba(255,255,255,0.02);
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      animation: fade 1.2s 1.2s ease both;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--glow-c);
      box-shadow: 0 0 10px var(--glow-c);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: 0.3; } }

    .contact {
      margin-top: 20px;
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color .2s, border-color .2s;
      animation: fade 1.2s 1.35s ease both;
    }
    .contact:hover, .contact:focus-visible {
      color: var(--fg);
      border-color: rgba(255,255,255,0.3);
      outline: none;
    }

    footer {
      position: fixed;
      bottom: 20px; left: 0; right: 0;
      z-index: 1;
      text-align: center;
      color: var(--faint);
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      animation: fade 1.2s 1.5s ease both;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="aurora"></div>
    <div class="horizon"></div>
    <div class="grain"></div>
  </div>

  <main>
    <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#22d3ee"/>
          <stop offset=".5" stop-color="#4f7cff"/>
          <stop offset="1" stop-color="#9b5cff"/>
        </linearGradient>
      </defs>
      <circle cx="24" cy="24" r="21" fill="none" stroke="url(#g)" stroke-width="2"/>
      <path d="M5 28 Q24 16 43 28" fill="none" stroke="url(#g)" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <h1>Panomera</h1>
    <p class="tagline">Something new is taking shape.</p>
    <div class="status"><span class="dot"></span>In stealth</div>
    <a class="contact" href="mailto:queries@panomera.ai">queries@panomera.ai</a>
  </main>

  <footer>&copy; <span id="y">2026</span> Panomera</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
